name: 'weather_dbt'
version: '1.0.0'
config-version: 2

profile: 'weather_dbt'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  weather_dbt:
    locations:
      +column_types:
        latitude: double precision
        longitude: double precision

models:
  weather_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics
