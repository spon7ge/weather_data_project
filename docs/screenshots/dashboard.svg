  <rect x="480" y="200" width="420" height="120" rx="6" fill="#fff" stroke="#ddd"/><text x="690" y="265" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">Daily anomaly bars</text>
  <rect x="60" y="340" width="400" height="80" rx="6" fill="#fff" stroke="#ddd"/><text x="260" y="385" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">Precipitation by location</text>
  <rect x="480" y="340" width="420" height="80" rx="6" fill="#fff" stroke="#ddd"/><text x="690" y="385" text-anchor="middle" font-family="system-ui" font-size="13" fill="#333">Anomaly heatmap</text>
