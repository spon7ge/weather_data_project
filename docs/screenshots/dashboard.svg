<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="#1d3557"/>
  <text x="480" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#fff">US Weather Forecast Dashboard</text>
  <text x="480" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#a8c0dc">Replace with Power BI screenshot or dashboard_preview.html capture</text>
  <rect x="40" y="100" width="880" height="340" rx="8" fill="#f5f6f8"/>
  <rect x="60" y="120" width="130" height="60" rx="6" fill="#fff" stroke="#ddd"/><text x="125" y="155" text-anchor="middle" font-family="system-ui" font-size="11" fill="#666">Network avg</text>
  <rect x="210" y="120" width="130" height="60" rx="6" fill="#fff" stroke="#ddd"/><text x="275" y="155" text-anchor="middle" font-family="system-ui" font-size="11" fill="#666">Hottest city</text>
  <rect x="360" y="120" width="130" height="60" rx="6" fill="#fff" stroke="#ddd"/><text x="425" y="155" text-anchor="middle" font-family="system-ui" font-size="11" fill="#666">Wettest city</text>
